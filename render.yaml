services:
  - type: web
    name: logicscout
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NEBIUS_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: LS_MODEL_DEEP
        sync: false
      - key: LS_MODEL_FAST
        sync: false
      - key: LS_SANDBOX_TOKEN
        generateValue: true
