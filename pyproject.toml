[project]
name = "logicscout"
version = "0.1.0"
description = "An AI that discovers how an unfamiliar system works, learns to operate it, and adapts when it changes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "openai>=1.54",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[project.scripts]
logicscout = "logicscout.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["logicscout"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
